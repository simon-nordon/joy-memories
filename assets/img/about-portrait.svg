<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="Main portrait — photographer at home, camera in lap, warm light">
  <defs>
    <linearGradient id="tone" x1="0.2500" y1="0.0670" x2="0.7500" y2="0.9330"><stop offset="0" stop-color="#FBEDE4"/><stop offset="0.46" stop-color="#E5C8BF"/><stop offset="1" stop-color="#A98089"/></linearGradient>
    <radialGradient id="key" cx="28%" cy="18%" r="72%">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="0.58" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1000" height="1500" fill="url(#tone)"/>
  <rect width="1000" height="1500" fill="url(#key)"/>
  <rect width="1000" height="1500" filter="url(#grain)" opacity=".14"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#fff">
    <text x="45" y="64" font-size="19" letter-spacing="3.04" opacity=".62">PLACEHOLDER</text>
    <text text-anchor="middle" font-size="33" letter-spacing="4.29" opacity=".95" style="paint-order:stroke" stroke="rgba(0,0,0,.22)" stroke-width="4.62"><tspan x="500" y="703.1">Main portrait —</tspan><tspan x="500" y="750.0">photographer at home,</tspan><tspan x="500" y="796.9">camera in lap, warm light</tspan></text>
    <text x="45" y="1460" font-size="19" letter-spacing="3.04" opacity=".55">ABOUT-PORTRAIT · 1000×1500</text>
  </g>
</svg>
